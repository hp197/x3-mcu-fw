; x3-mcu-fw -- PlatformIO build for the Segway-Ninebot x3 MCU (motor-controller) firmware.
; (Artery AT32F415-class Cortex-M4; slot 0 of flash @ 0x08001000.)
;
; Built on the official Artery AT32F415 BSP (BSD-3-Clause) + CMSIS.
;
;   pio run             # build
;   pio run -t clean    # clean
;   (upload/debug are intentionally disabled -- flash via the x3 bootloader)

[platformio]
default_envs = mcu

[env:mcu]
platform  = https://github.com/ArteryTek/platform-arterytekat32.git
board     = genericAT32F415CBT7
framework = at32firmlib

; application linker: vectors at 0x08001000, 60 KB slot-0 region.
board_build.ldscript = x3-mcu-fw.ld

; the MCU app owns slot 0 (0x08001000-0x0800FFFF = 60 KB). Size-check against that.
board_upload.maximum_size = 61440

build_flags =
    -I include
    -ffunction-sections
    -fdata-sections
    -Wall

build_src_flags =
    -Werror=undef

; build-only: flash the resulting image to 0x08001000 via the bootloader.
upload_protocol = custom
upload_command  = python -c "raise SystemExit('x3-mcu-fw is build-only: upload is disabled.')"
